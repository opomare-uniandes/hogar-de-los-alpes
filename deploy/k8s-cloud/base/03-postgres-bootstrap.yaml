# Postgres vive fuera del cluster (RDS, una instancia con hda_trabajos como base primaria).
# Este Job crea las bases separadas de usuarios, proveedor y Saga Log si no existen.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-databases-bootstrap-v2
  namespace: hda
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:18-alpine
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_PORT } }
            - name: POSTGRES_USUARIOS_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_USUARIOS_DB } }
            - name: POSTGRES_PROVEEDOR_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_PROVEEDOR_DB } }
            - name: POSTGRES_TRABAJO_SAGA_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_TRABAJO_SAGA_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "Esperando RDS en $POSTGRES_HOST:$POSTGRES_PORT ..."
                sleep 5
              done
              for DATABASE in "$POSTGRES_USUARIOS_DB" "$POSTGRES_PROVEEDOR_DB" "$POSTGRES_TRABAJO_SAGA_DB"; do
                EXISTE=$(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -tAc \
                  "SELECT 1 FROM pg_database WHERE datname = '${DATABASE}'")
                if [ "$EXISTE" != "1" ]; then
                  psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -c \
                    "CREATE DATABASE \"${DATABASE}\" OWNER \"${POSTGRES_USER}\";"
                  echo "Base ${DATABASE} creada."
                else
                  echo "Base ${DATABASE} ya existe."
                fi
              done
