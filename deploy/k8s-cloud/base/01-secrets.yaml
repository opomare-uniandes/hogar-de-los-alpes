# Credenciales de RDS Postgres. La password la genera Terraform (random_password en el
# modulo rds) y nunca se commitea: __POSTGRES_PASSWORD__ lo sustituye apply.sh leyendo
# `terraform output -raw rds_master_password` justo antes de aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hda
type: Opaque
stringData:
  POSTGRES_USER: "hda"
  POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-credentials
  namespace: hda
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION: "__OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION__"
