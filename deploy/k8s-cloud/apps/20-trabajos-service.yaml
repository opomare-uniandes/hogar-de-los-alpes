apiVersion: apps/v1
kind: Deployment
metadata:
  name: trabajos-service
  namespace: hda
  labels:
    app: trabajos-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trabajos-service
  template:
    metadata:
      labels:
        app: trabajos-service
    spec:
      containers:
        - name: trabajos-service
          image: __TRABAJOS_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: PULSAR_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_SERVICE_URL } }
            - name: PULSAR_ADMIN_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_ADMIN_URL } }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: trabajos-service
  namespace: hda
spec:
  selector:
    app: trabajos-service
  ports:
    - port: 8081
      targetPort: 8081
