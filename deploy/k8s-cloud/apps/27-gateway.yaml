apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: hda-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: hda-gateway-lbconfig
  namespace: hda
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hda-gateway
  namespace: hda
spec:
  gatewayClassName: hda-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: hda-gateway-lbconfig
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# El BFF es el unico servicio expuesto. Los seis servicios de negocio permanecen ClusterIP.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: bff-service-tgconfig
  namespace: hda
spec:
  targetReference:
    name: bff-service
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /actuator/health
      matcher:
        httpCode: "200"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-service-route
  namespace: hda
spec:
  parentRefs:
    - name: hda-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bff-service
          port: 8080
