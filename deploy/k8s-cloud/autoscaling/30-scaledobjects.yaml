apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: trabajos-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: trabajos-service
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "60"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/crear-trabajo-command
        subscription: trabajos-crear-command-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/asignar-trabajo-command
        subscription: trabajos-asignar-command-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/cancelar-trabajo-command
        subscription: trabajos-cancelar-command-sub
        msgBacklogThreshold: "10"
---
