# Entorno local completo (infra + 6 servicios: los 4 de la Entrega 4 mas proveedor-service
# y trabajo-saga-service de la Entrega 5) para pruebas rapidas.
#
# Uso (desde deploy/docker-compose/):
#   cp .env.example .env   # ajusta al menos POSTGRES_PASSWORD
#   docker compose up -d
#
# Solo infra (como antes, corriendo los servicios con `java -jar` por fuera):
#   docker compose up -d postgres pulsar redis
#
# Los servicios Spring leen host/credenciales por variables de entorno; aqui apuntan
# a los NOMBRES DE SERVICIO internos de compose (postgres, pulsar, redis), no a localhost.

x-otel-env: &otel-env
  OTEL_COLLECTOR_HOST: ${OTEL_COLLECTOR_HOST:-http://host.docker.internal:4318}
  OTEL_TRACING_SAMPLING: ${OTEL_TRACING_SAMPLING:-1.0}
  OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION: ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:-Basic }
  SERVICE_ENV: ${SERVICE_ENV:-local}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:18-alpine
    container_name: hda-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hda_trabajos}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      POSTGRES_USUARIOS_DB: ${POSTGRES_USUARIOS_DB:-hda_usuarios}
      POSTGRES_PROVEEDOR_DB: ${POSTGRES_PROVEEDOR_DB:-hda_proveedor}
      POSTGRES_TRABAJO_SAGA_DB: ${POSTGRES_TRABAJO_SAGA_DB:-hda_trabajo_saga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hda} -d ${POSTGRES_DB:-hda_trabajos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:4.2.4
    container_name: hda-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # protocolo binario (productores/consumidores)
      - "8080:8080"   # admin REST + schema registry
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # One-shot: crea el tenant "hda" y los namespaces que usan los topicos del proyecto.
  # Equivale al paso 2 del README (pulsar-admin ... create) y al Job pulsar-bootstrap de k8s.
  # Sin esto, los servicios que publican/consumen en persistent://hda/... fallan con
  # "Namespace not found". Idempotente (|| true) y corre una sola vez (restart: "no").
  pulsar-init:
    image: apachepulsar/pulsar:4.2.4
    container_name: hda-pulsar-init
    depends_on:
      pulsar:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        bin/pulsar-admin --admin-url http://pulsar:8080 tenants create hda || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/trabajos || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/integracion || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/notificaciones || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/partner || true
        bin/pulsar-admin --admin-url http://pulsar:8080 namespaces create hda/proveedor || true
        echo "Tenant/namespaces hda listos."

  redis:
    image: redis:8.10.1-alpine
    container_name: hda-redis
    command: redis-server --appendonly yes   # AOF: la deduplicacion sobrevive reinicios
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # --- Los 4 servicios Spring Boot de la Entrega 4 ---
  # Comparten el mismo Dockerfile; cada uno es su propio modulo Gradle bootable
  # (arg SERVICE selecciona cual: trabajos/integracion/notificaciones/usuarios).
  trabajos-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: trabajos
    image: hda/trabajos-service:local
    container_name: hda-trabajos
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hda_trabajos}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    extra_hosts: *host-gateway
    ports:
      - "8081:8081"

  integracion-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: integracion
    image: hda/integracion-service:local
    container_name: hda-integracion
    depends_on:
      pulsar-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      <<: *otel-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
      # Solo para la evidencia reproducible del escenario de interoperabilidad V1/V2.
      # Mantener en false durante las ejecuciones normales.
      HDA_DEMO_PARTNER_ENABLED: ${HDA_DEMO_PARTNER_ENABLED:-false}
    extra_hosts: *host-gateway
    ports:
      - "8082:8082"

  notificaciones-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: notificaciones
    image: hda/notificaciones-service:local
    container_name: hda-notificaciones
    depends_on:
      pulsar-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      usuarios-service:
        condition: service_started
    environment:
      <<: *otel-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
      USUARIOS_SERVICE_BASE_URL: http://usuarios-service:8084
    extra_hosts: *host-gateway
    ports:
      - "8083:8083"

  usuarios-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: usuarios
    image: hda/usuarios-service:local
    container_name: hda-usuarios
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *otel-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USUARIOS_DB: ${POSTGRES_USUARIOS_DB:-hda_usuarios}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
    extra_hosts: *host-gateway
    ports:
      - "8084:8084"

  # --- Los 2 servicios nuevos de la Entrega 5 (saga "Asignacion de trabajo con proveedor") ---
  # Mismo Dockerfile/patron que los 4 de arriba.
  proveedor-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: proveedor
    image: hda/proveedor-service:local
    container_name: hda-proveedor
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PROVEEDOR_DB: ${POSTGRES_PROVEEDOR_DB:-hda_proveedor}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    ports:
      - "8085:8085"

  trabajo-saga-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker-compose/Dockerfile
      args:
        SERVICE: trabajo-saga
    image: hda/trabajo-saga-service:local
    container_name: hda-trabajo-saga
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_TRABAJO_SAGA_DB: ${POSTGRES_TRABAJO_SAGA_DB:-hda_trabajo_saga}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    ports:
      - "8086:8086"

volumes:
  pgdata:
  redisdata:
