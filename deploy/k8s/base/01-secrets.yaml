# Credenciales de Postgres. Para local; en produccion usar un gestor de secretos real.
# stringData deja escribir los valores en claro; k8s los codifica a base64 al guardarlos.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hda
type: Opaque
stringData:
  POSTGRES_USER: "hda"
  POSTGRES_PASSWORD: "changeit"
