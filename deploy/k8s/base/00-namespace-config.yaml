# Namespace y configuracion comun (no-secreta) para todo el stack de Hogar de los Alpes.
apiVersion: v1
kind: Namespace
metadata:
  name: hda
---
# Endpoints internos del cluster. Los nombres son los de los Services de k8s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hda-endpoints
  namespace: hda
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "hda_trabajos"
  POSTGRES_USUARIOS_DB: "hda_usuarios"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PULSAR_SERVICE_URL: "pulsar://pulsar:6650"
  PULSAR_ADMIN_URL: "http://pulsar:8080"
  USUARIOS_SERVICE_BASE_URL: "http://usuarios-service:8084"
