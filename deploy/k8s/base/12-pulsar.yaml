# Pulsar standalone (bus de eventos). Basado en poc-pulsar-scaling/k8s/00-pulsar.yaml,
# adaptado al namespace hda y con un Job que crea el tenant/namespaces que usa este proyecto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: hda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.2.4
          command: ["bin/pulsar", "standalone"]
          ports:
            - containerPort: 6650
              name: broker
            - containerPort: 8080
              name: admin
          env:
            - name: PULSAR_PREFIX_advertisedAddress
              value: "pulsar"
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx1g"
          readinessProbe:
            httpGet:
              path: /admin/v2/namespaces/public/default
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: hda
spec:
  selector:
    app: pulsar
  ports:
    - name: broker
      port: 6650
      targetPort: 6650
    - name: admin
      port: 8080
      targetPort: 8080
---
# Crea el tenant "hda" y los namespaces (trabajos/integracion/notificaciones) que exigen
# los topicos del proyecto. Equivalente al paso 2 del README (pulsar-admin ... create).
# Reintenta hasta que el broker responde. Idempotente: ignora "ya existe".
apiVersion: batch/v1
kind: Job
metadata:
  name: pulsar-bootstrap
  namespace: hda
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: apachepulsar/pulsar:4.2.4
          command:
            - /bin/bash
            - -c
            - |
              set -e
              ADMIN=http://pulsar:8080
              echo "Esperando a Pulsar admin en $ADMIN ..."
              until curl -sf "$ADMIN/admin/v2/clusters" >/dev/null; do sleep 5; done
              bin/pulsar-admin --admin-url "$ADMIN" tenants create hda || true
              bin/pulsar-admin --admin-url "$ADMIN" namespaces create hda/trabajos || true
              bin/pulsar-admin --admin-url "$ADMIN" namespaces create hda/integracion || true
              bin/pulsar-admin --admin-url "$ADMIN" namespaces create hda/notificaciones || true
              bin/pulsar-admin --admin-url "$ADMIN" namespaces create hda/partner || true
              echo "Tenant/namespaces listos."
