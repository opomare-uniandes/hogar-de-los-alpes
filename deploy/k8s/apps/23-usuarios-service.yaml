# usuarios-service: expone GET /usuarios/{clienteId}/contacto, persiste en hda_usuarios.
# Lo consulta notificaciones-service (unico punto sincrono del sistema).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-service
  namespace: hda
  labels:
    app: usuarios-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-service
  template:
    metadata:
      labels:
        app: usuarios-service
    spec:
      containers:
        - name: usuarios-service
          image: hda/usuarios-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_PORT } }
            - name: POSTGRES_USUARIOS_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_USUARIOS_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-service
  namespace: hda
spec:
  selector:
    app: usuarios-service
  ports:
    - port: 8084
      targetPort: 8084
