apiVersion: apps/v1
kind: Deployment
metadata:
  name: trabajo-saga-service
  namespace: hda
  labels:
    app: trabajo-saga-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trabajo-saga-service
  template:
    metadata:
      labels:
        app: trabajo-saga-service
    spec:
      # Da tiempo a drenar mensajes Pulsar en vuelo (ver ConsumoEnVueloTracker, hasta 25s)
      # antes de que Kubernetes mate el pod, necesario ahora que KEDA puede escalar hacia abajo.
      terminationGracePeriodSeconds: 40
      containers:
        - name: trabajo-saga-service
          image: hda/trabajo-saga-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_PORT } }
            - name: POSTGRES_TRABAJO_SAGA_DB
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: POSTGRES_TRABAJO_SAGA_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: PULSAR_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_SERVICE_URL } }
            - name: PULSAR_ADMIN_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_ADMIN_URL } }
            - name: OTEL_COLLECTOR_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_COLLECTOR_HOST } }
            - name: OTEL_TRACING_SAMPLING
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_TRACING_SAMPLING } }
            - name: SERVICE_ENV
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: SERVICE_ENV } }
            - name: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION
              valueFrom: { secretKeyRef: { name: otel-credentials, key: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION } }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: trabajo-saga-service
  namespace: hda
spec:
  selector:
    app: trabajo-saga-service
  ports:
    - port: 8086
      targetPort: 8086
