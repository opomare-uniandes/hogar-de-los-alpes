# notificaciones-service: consume trabajo-creado (sub notificaciones-service-sub), consulta
# el contacto en usuarios-service (unico punto sincrono) y publica notificacion-enviada.
# Escalable por KEDA segun el backlog de su suscripcion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones-service
  namespace: hda
  labels:
    app: notificaciones-service
spec:
  replicas: 1   # empieza en 1 para registrar la suscripcion; luego KEDA la escala.
  selector:
    matchLabels:
      app: notificaciones-service
  template:
    metadata:
      labels:
        app: notificaciones-service
    spec:
      containers:
        - name: notificaciones-service
          image: hda/notificaciones-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: REDIS_PORT } }
            - name: PULSAR_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_SERVICE_URL } }
            - name: PULSAR_ADMIN_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_ADMIN_URL } }
            - name: USUARIOS_SERVICE_BASE_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: USUARIOS_SERVICE_BASE_URL } }
            - name: OTEL_COLLECTOR_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_COLLECTOR_HOST } }
            - name: OTEL_TRACING_SAMPLING
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_TRACING_SAMPLING } }
            - name: SERVICE_ENV
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: SERVICE_ENV } }
            - name: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION
              valueFrom: { secretKeyRef: { name: otel-credentials, key: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION } }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones-service
  namespace: hda
spec:
  selector:
    app: notificaciones-service
  ports:
    - port: 8083
      targetPort: 8083
