# Deployment dedicado al partner B2B2C "Seguros de los Alpes" (contrato v1). Escenario 4 de
# escalabilidad: cada partner escala de forma aislada ante un pico de trafico (hasta 4x), sin
# consumir la capacidad de otro partner ni del flujo de salida (integracion-service). Por eso
# es un Deployment propio con su propio ScaledObject (ver 30-scaledobjects.yaml), no un trigger
# mas del ScaledObject de integracion-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integracion-service-seguros-los-alpes
  namespace: hda
  labels:
    app: integracion-service-seguros-los-alpes
spec:
  replicas: 1   # KEDA toma el control despues; empieza en 1 para registrar la suscripcion.
  selector:
    matchLabels:
      app: integracion-service-seguros-los-alpes
  template:
    metadata:
      labels:
        app: integracion-service-seguros-los-alpes
    spec:
      containers:
        - name: integracion-service
          image: hda/integracion-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: HDA_INTEGRACION_OUTBOUND_ENABLED
              value: "false"
            - name: PARTNER_CONTRACT_VERSION
              value: "v1"
            - name: PARTNER_TOPIC
              value: "persistent://hda/partner/solicitud-trabajo-seguros-los-alpes"
            - name: PARTNER_SUBSCRIPTION
              value: "integracion-partner-seguros-los-alpes-sub"
            - name: PARTNER_ID
              value: "11111111-1111-1111-1111-111111111111"
            - name: SERVICE_NAME
              value: "integracion-seguros-los-alpes"
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: REDIS_PORT } }
            - name: PULSAR_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_SERVICE_URL } }
            - name: PULSAR_ADMIN_URL
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: PULSAR_ADMIN_URL } }
            - name: OTEL_COLLECTOR_HOST
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_COLLECTOR_HOST } }
            - name: OTEL_TRACING_SAMPLING
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: OTEL_TRACING_SAMPLING } }
            - name: SERVICE_ENV
              valueFrom: { configMapKeyRef: { name: hda-endpoints, key: SERVICE_ENV } }
            - name: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION
              valueFrom: { secretKeyRef: { name: otel-credentials, key: OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION } }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: integracion-service-seguros-los-alpes
  namespace: hda
spec:
  selector:
    app: integracion-service-seguros-los-alpes
  ports:
    - port: 8082
      targetPort: 8082
