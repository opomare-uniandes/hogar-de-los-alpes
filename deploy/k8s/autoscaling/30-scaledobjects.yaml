# Autoescalado por backlog de topico (KEDA + trigger apache-pulsar).
# Mismo patron que poc-pulsar-scaling/k8s/03-scaled-object.yaml, aqui para los dos
# consumidores del sistema. KEDA consulta el admin de Pulsar y mide el backlog POR
# SUSCRIPCION (no por topico), asi que cada ScaledObject apunta a su propia subscription.
#
# minReplicaCount: 1 (no 0) a proposito: la suscripcion Shared solo existe en Pulsar
# cuando el consumidor se conecta la primera vez (@PulsarListener). Si arrancara en 0, la
# suscripcion no existiria, el admin devolveria 404 y KEDA nunca escalaria (deadlock
# chicken-and-egg descrito en el README del POC). Con 1 replica base la suscripcion queda
# registrada y KEDA escala hacia arriba con el backlog.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: integracion-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: integracion-service
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: apache-pulsar
      metadata:
        adminURL: http://pulsar:8080
        topic: persistent://hda/trabajos/trabajo-creado
        subscription: integracion-service-sub
        msgBacklogThreshold: "10"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notificaciones-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: notificaciones-service
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: apache-pulsar
      metadata:
        adminURL: http://pulsar:8080
        topic: persistent://hda/trabajos/trabajo-creado
        subscription: notificaciones-service-sub
        msgBacklogThreshold: "10"
