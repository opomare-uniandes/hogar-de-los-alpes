# trabajos-service atiende su API REST (crear/consultar trabajo) Y consume 3 comandos Pulsar
# (crear/asignar/cancelar-trabajo-command) en el mismo deployable (ver trabajos-application).
# Trigger CPU cubre la carga REST; los 3 triggers pulsar cubren el rezago de los comandos, que
# es la parte de "orquestacion de trabajos" que el escenario de escalabilidad exige que reaccione
# a eventos pendientes y no solo a CPU/RAM. KEDA escala al maximo que pida cualquier trigger.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: trabajos-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: trabajos-service
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "60"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/crear-trabajo-command
        subscription: trabajos-crear-command-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/asignar-trabajo-command
        subscription: trabajos-asignar-command-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/cancelar-trabajo-command
        subscription: trabajos-cancelar-command-sub
        msgBacklogThreshold: "10"
---
# trabajo-saga-service es el motor de asignacion (orquestador de la saga). Antes tenia
# replicas fijas en 1 sin autoescalado; escala por el rezago de cada una de sus 6 suscripciones,
# ya que cualquiera de ellas puede acumular backlog segun en que paso de la saga este el pico
# de trabajo. Requiere ConsumoEnVueloTracker + terminationGracePeriodSeconds (ver
# 25-trabajo-saga-service.yaml) para que el scale-down no interrumpa un guardar() a mitad.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: trabajo-saga-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: trabajo-saga-service
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/trabajo-creado
        subscription: trabajo-saga-trabajo-creado-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/proveedor/proveedor-reservado
        subscription: trabajo-saga-proveedor-reservado-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/proveedor/proveedor-no-disponible
        subscription: trabajo-saga-proveedor-no-disponible-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/trabajo-asignado
        subscription: trabajo-saga-trabajo-asignado-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/trabajo-cancelado
        subscription: trabajo-saga-trabajo-cancelado-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/notificaciones/notificacion-enviada
        subscription: trabajo-saga-notificacion-enviada-sub
        msgBacklogThreshold: "10"
