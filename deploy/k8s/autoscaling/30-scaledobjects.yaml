# Autoescalado por backlog de topico (KEDA + trigger pulsar). integracion-service atiende dos
# flujos en el mismo deployable: TrabajoCreadoListener (saliente, notifica a partners externos
# de trabajos ya creados) y SolicitudTrabajoPartnerListener (entrante, ACL que traduce las
# solicitudes que un partner B2B2C envia). El escenario de escalabilidad por pico de partner
# depende del segundo flujo, por eso los triggers de solicitud-partner-v1/v2 son necesarios
# ademas del trigger original de trabajo-creado.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: integracion-service-scaler
  namespace: hda
spec:
  scaleTargetRef:
    name: integracion-service
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/trabajos/trabajo-creado
        subscription: integracion-service-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/partner/solicitud-trabajo-v1
        subscription: integracion-partner-v1-sub
        msgBacklogThreshold: "10"
    - type: pulsar
      metadata:
        adminURL: http://pulsar.hda.svc.cluster.local:8080
        topic: persistent://hda/partner/solicitud-trabajo-v2
        subscription: integracion-partner-v2-sub
        msgBacklogThreshold: "10"
---
