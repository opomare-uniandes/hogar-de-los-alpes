server:
  port: 8082

spring:
  application:
    name: integracion-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  reactor:
    context-propagation: auto
hda:
  pulsar:
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    admin-url: ${PULSAR_ADMIN_URL:http://localhost:8080}
    topic-trabajo-creado: persistent://hda/trabajos/trabajo-creado
    topic-trabajo-siniestro-creado: persistent://hda/integracion/trabajo-siniestro-creado
    topic-crear-trabajo-command: persistent://hda/trabajos/crear-trabajo-command
    topic-solicitud-partner-rechazada: persistent://hda/partner/solicitud-trabajo-rechazada-v1
    subscription: integracion-service-sub
    # Un solo partner por instancia de este servicio (ver escenario 4 de escalabilidad):
    # cada partner tiene su propio topico/suscripcion y su propio Deployment+ScaledObject en k8s
    # (deploy/k8s/apps/21-integracion-service-*.yaml), asi que ninguno consume la capacidad de
    # otro ante un pico de trafico. Los valores de aqui son el default local (partner "Seguros de
    # los Alpes", contrato v1); en k8s cada Deployment los sobreescribe por variables de entorno.
    partner:
      contract-version: ${PARTNER_CONTRACT_VERSION:v1}
      topic: ${PARTNER_TOPIC:persistent://hda/partner/solicitud-trabajo-seguros-los-alpes}
      subscription: ${PARTNER_SUBSCRIPTION:integracion-partner-seguros-los-alpes-sub}
  integracion:
    # Los dos flujos de integracion-service (salida: trabajo-creado->trabajo-siniestro-creado;
    # entrada: ACL de partner) viven en el mismo jar pero se activan/desactivan por separado, para
    # poder desplegar una instancia dedicada por partner que SOLO atienda su ACL de entrada (ver
    # SolicitudTrabajoPartnerListener / TrabajoCreadoListener). Por defecto ambos estan activos,
    # que es el comportamiento de siempre (un solo integracion-service haciendo las dos cosas).
    outbound:
      enabled: ${HDA_INTEGRACION_OUTBOUND_ENABLED:true}
    inbound-partner:
      enabled: ${HDA_INTEGRACION_INBOUND_PARTNER_ENABLED:true}
  demo:
    partner:
      enabled: false
      partner-id: ${PARTNER_ID:11111111-1111-1111-1111-111111111111}
  idempotencia:
    ttl: PT24H

logging:
  level:
    org.apache.pulsar.client.impl.ProducerStatsRecorderImpl: WARN
    org.apache.pulsar.client.impl.ConsumerStatsRecorderImpl: WARN

management:
  endpoints:
    web:
      exposure:
    include: "health, metrics"
  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"
  metrics:
    enable:
      all: "${METRICS_ENABLE_ALL:true}"
  tracing:
    sampling:
      probability: "${OTEL_TRACING_SAMPLING:1.0}"
arconia:
  otel:
    exporter:
      type: otlp
    metrics:
      enabled: true
      exporter:
        interval: 60s
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/metrics"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    traces:
      enabled: true
      sampling:
        strategy: parent-based-trace-id-ratio
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/traces"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    logs:
      enabled: true
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/logs"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    resource:
      attributes:
        deployment.environment.name: "${SERVICE_ENV:local}"
        service.name: "${SERVICE_NAME:integracion}"
