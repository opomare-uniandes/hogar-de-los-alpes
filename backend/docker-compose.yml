services:
  postgres:
    image: postgres:16-alpine
    container_name: hda-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hda_trabajos}
      POSTGRES_USER: ${POSTGRES_USER:-hda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hda}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pulsar:
    image: apachepulsar/pulsar:3.3.1
    container_name: hda-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # protocolo binario (productores/consumidores)
      - "8080:8080"   # admin REST + schema registry

  redis:
    image: redis:7-alpine
    container_name: hda-redis
    command: redis-server --appendonly yes   # AOF: la deduplicacion sobrevive reinicios
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
