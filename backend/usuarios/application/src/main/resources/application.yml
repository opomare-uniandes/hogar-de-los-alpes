server:
  port: 8084

spring:
  application:
    name: usuarios-service
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_USUARIOS_DB:hda_usuarios}
    username: ${POSTGRES_USER:hda}
    password: ${POSTGRES_PASSWORD:changeit}
  sql:
    init:
      mode: always   # ejecuta schema.sql al arrancar (crea la tabla y siembra los 3 usuarios si no existen)
      schema-locations: classpath:usuarios/schema.sql
  reactor:
    context-propagation: auto
management:
  endpoints:
    web:
      exposure:
    include: "health, metrics"
  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"
  metrics:
    enable:
      all: "${METRICS_ENABLE_ALL:true}"
  tracing:
    sampling:
      probability: "${OTEL_TRACING_SAMPLING:1.0}"
arconia:
  otel:
    exporter:
      type: otlp
    metrics:
      enabled: true
      exporter:
        interval: 60s
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/metrics"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    traces:
      enabled: true
      sampling:
        strategy: parent-based-trace-id-ratio
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/traces"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    logs:
      enabled: true
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/logs"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    resource:
      attributes:
        deployment.environment.name: "${SERVICE_ENV:local}"
        service.name: "${SERVICE_NAME:usuarios}"