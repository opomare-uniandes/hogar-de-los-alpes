server:
  port: 8081

spring:
  application:
    name: trabajos-service
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hda_trabajos}
    username: ${POSTGRES_USER:hda}
    password: ${POSTGRES_PASSWORD:changeit}
  sql:
    init:
      mode: always   # ejecuta schema.sql al arrancar (crea las tablas si no existen)
  reactor:
    context-propagation: auto
hda:
  pulsar:
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    admin-url: ${PULSAR_ADMIN_URL:http://localhost:8080}
    topic-trabajo-creado: persistent://hda/trabajos/trabajo-creado
    topic-crear-trabajo-command: persistent://hda/trabajos/crear-trabajo-command
    subscription-crear-trabajo-command: trabajos-crear-command-sub

    # Saga "Asignacion de trabajo con proveedor" (trabajo-saga-service es quien publica los
    # comandos y consume estos eventos - mismas cadenas que en su application.yml).
    topic-trabajo-asignado: persistent://hda/trabajos/trabajo-asignado
    topic-trabajo-cancelado: persistent://hda/trabajos/trabajo-cancelado
    topic-asignar-trabajo-command: persistent://hda/trabajos/asignar-trabajo-command
    subscription-asignar-trabajo-command: trabajos-asignar-command-sub
    topic-cancelar-trabajo-command: persistent://hda/trabajos/cancelar-trabajo-command
    subscription-cancelar-trabajo-command: trabajos-cancelar-command-sub

logging:
  level:
    org.apache.pulsar.client.impl.ProducerStatsRecorderImpl: WARN


management:
  endpoints:
    web:
      exposure:
    include: "health, metrics"
  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"
  metrics:
    enable:
      all: "${METRICS_ENABLE_ALL:true}"
  tracing:
    sampling:
      probability: "${OTEL_TRACING_SAMPLING:1.0}"
arconia:
  otel:
    exporter:
      type: otlp
    metrics:
      enabled: true
      exporter:
        interval: 60s
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/metrics"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    traces:
      enabled: true
      sampling:
        strategy: parent-based-trace-id-ratio
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/traces"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    logs:
      enabled: true
      exporter:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/logs"
          headers:
            Authorization: "${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:Basic }"
    resource:
      attributes:
        deployment.environment.name: "${SERVICE_ENV:local}"
        service.name: "${SERVICE_NAME:trabajos}"
