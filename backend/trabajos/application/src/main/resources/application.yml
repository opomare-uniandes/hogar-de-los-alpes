server:
  port: 8081

spring:
  application:
    name: trabajos-service
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hda_trabajos}
    username: ${POSTGRES_USER:hda}
    password: ${POSTGRES_PASSWORD:changeit}
  sql:
    init:
      mode: always   # ejecuta schema.sql al arrancar (crea las tablas si no existen)

hda:
  pulsar:
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    admin-url: ${PULSAR_ADMIN_URL:http://localhost:8080}
    topic-trabajo-creado: persistent://hda/trabajos/trabajo-creado
    topic-crear-trabajo-command: persistent://hda/trabajos/crear-trabajo-command
    subscription-crear-trabajo-command: trabajos-crear-command-sub

logging:
  level:
    org.apache.pulsar.client.impl.ProducerStatsRecorderImpl: WARN


management:
  endpoints:
    web:
      exposure:
        include: "health, metrics"

  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"

  observations:
    annotations:
      enabled: true

  otlp:
    metrics:
      export:
        enabled: "${OTEL_COLLECTOR_ENABLED:false}"
        url: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/metrics"
        step: "${OTEL_COLLECTOR_STEP:1m}"
        headers:
          Authorization: "Basic "
  metrics:
    enable:
      all: "${METRICS_ENABLE_ALL:true}"

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/traces"
          compression: "gzip"
          headers:
            Authorization: "Basic "

    resource-attributes:
      service.name: "${SERVICE_NAME:trabajos}"

  tracing:
    export:
      enabled: "${OTEL_TRACING_ENABLED:false}"
    sampling:
      probability: "${OTEL_TRACING_SAMPLING:1.0}"
