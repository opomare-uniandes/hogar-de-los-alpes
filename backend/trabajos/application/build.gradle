apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':trabajos-model')
    implementation project(':trabajos-usecase')
    implementation project(':trabajos-reactive-web')
    implementation project(':trabajos-r2dbc-postgresql')
    implementation project(':trabajos-pulsar-event-bus')
    implementation project(':trabajos-pulsar-command-handler')

    implementation 'org.springframework.boot:spring-boot-starter' // @SpringBootApplication
    implementation 'org.apache.pulsar:pulsar-client-api' // PulsarConfig expone el bean PulsarClient
    implementation 'org.springframework.boot:spring-boot-r2dbc' // spring.sql.init.mode: always

    // OutboxRelay (config/outbox) vive aqui porque necesita tanto el repositorio de outbox
    // (trabajos-r2dbc-postgresql) como el publisher de Pulsar (trabajos-pulsar-event-bus);
    // 'implementation' en esos modulos no re-expone sus propias dependencias en compileClasspath,
    // asi que se declaran explicitas aqui.
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

bootJar {
    archiveFileName = 'trabajos-service.jar'
}
