apply plugin: 'org.springframework.boot'

import org.springframework.boot.gradle.tasks.bundling.BootJar

dependencies {
    implementation project(':trabajos-reactive-web')
    implementation project(':trabajos-r2dbc-postgresql')
    implementation project(':trabajos-pulsar-event-bus')
    implementation project(':trabajos-model')
    implementation project(':trabajos-usecase')

    implementation project(':integracion-pulsar-event-handler')
    implementation project(':integracion-pulsar-event-bus')
    implementation project(':integracion-redis-idempotency')
    implementation project(':integracion-model')
    implementation project(':integracion-usecase')

    implementation project(':notificaciones-pulsar-event-handler')
    implementation project(':notificaciones-pulsar-event-bus')
    implementation project(':notificaciones-email-sender')
    implementation project(':notificaciones-redis-idempotency')
    implementation project(':notificaciones-model')
    implementation project(':notificaciones-usecase')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.apache.pulsar:pulsar-client-api'
    implementation 'org.springframework.boot:spring-boot-r2dbc'
    implementation 'org.springframework.boot:spring-boot-data-redis' // para excluir su autoconfig en trabajos-service
}

jar {
    enabled = false
}

bootJar {
    enabled = false
}
resolveMainClassName {
    enabled = false
}

def bootJarJavaVersion = JavaVersion.toVersion(java.toolchain.languageVersion.get().asInt())

tasks.register('bootJarTrabajos', BootJar) {
    group = 'build'
    description = 'Empaqueta trabajos-service.jar (TrabajosServiceApplication).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hda.trabajos.TrabajosServiceApplication'
    archiveFileName = 'trabajos-service.jar'
    targetJavaVersion.set(bootJarJavaVersion)
}

tasks.register('bootJarIntegracion', BootJar) {
    group = 'build'
    description = 'Empaqueta integracion-service.jar (IntegracionServiceApplication).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hda.integracion.IntegracionServiceApplication'
    archiveFileName = 'integracion-service.jar'
    targetJavaVersion.set(bootJarJavaVersion)
}

tasks.register('bootJarNotificaciones', BootJar) {
    group = 'build'
    description = 'Empaqueta notificaciones-service.jar (NotificacionesServiceApplication).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hda.notificaciones.NotificacionesServiceApplication'
    archiveFileName = 'notificaciones-service.jar'
    targetJavaVersion.set(bootJarJavaVersion)
}

assemble.dependsOn bootJarTrabajos, bootJarIntegracion, bootJarNotificaciones
