server:
  port: 8083

spring:
  application:
    name: notificaciones-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

hda:
  pulsar:
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    admin-url: ${PULSAR_ADMIN_URL:http://localhost:8080}
    topic-trabajo-creado: persistent://hda/trabajos/trabajo-creado
    topic-notificacion-enviada: persistent://hda/notificaciones/notificacion-enviada
    subscription: notificaciones-service-sub

    # Saga "Asignacion de trabajo con proveedor" (mismas cadenas que en el application.yml
    # de trabajo-saga-service, que es quien publica estos comandos).
    topic-notificar-asignacion-command: persistent://hda/notificaciones/notificar-asignacion-command
    subscription-notificar-asignacion-command: notificaciones-notificar-asignacion-command-sub
    topic-notificar-fallo-command: persistent://hda/notificaciones/notificar-fallo-command
    subscription-notificar-fallo-command: notificaciones-notificar-fallo-command-sub
  idempotencia:
    ttl: PT24H
  usuarios-service:
    base-url: ${USUARIOS_SERVICE_BASE_URL:http://localhost:8084}

logging:
  level:
    org.apache.pulsar.client.impl.ProducerStatsRecorderImpl: WARN
    org.apache.pulsar.client.impl.ConsumerStatsRecorderImpl: WARN

management:
  endpoints:
    web:
      exposure:
        include: "health, metrics"

  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"

  observations:
    annotations:
      enabled: true

  otlp:
    metrics:
      export:
        enabled: "${OTEL_COLLECTOR_ENABLED:false}"
        url: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/metrics"
        step: "${OTEL_COLLECTOR_STEP:1m}"
        headers:
          Authorization: "Basic "
  metrics:
    enable:
      all: "${METRICS_ENABLE_ALL:true}"

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_COLLECTOR_HOST:http://localhost:4018}/v1/traces"
          compression: "gzip"
          headers:
            Authorization: "Basic "

    resource-attributes:
      service.name: "${SERVICE_NAME:notificaciones}"

  tracing:
    export:
      enabled: "${OTEL_TRACING_ENABLED:false}"
    sampling:
      probability: "${OTEL_TRACING_SAMPLING:1.0}"