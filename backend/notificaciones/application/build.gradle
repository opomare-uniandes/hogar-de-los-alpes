apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':notificaciones-model')
    implementation project(':notificaciones-usecase')
    implementation project(':notificaciones-pulsar-event-handler')
    implementation project(':notificaciones-pulsar-event-bus')
    implementation project(':notificaciones-canal-notificacion')
    implementation project(':notificaciones-usuarios-client')
    implementation project(':notificaciones-redis-idempotency')

    implementation 'org.springframework.boot:spring-boot-starter' // @SpringBootApplication
    implementation 'org.apache.pulsar:pulsar-client-api' // PulsarClientConfig expone el bean PulsarClient
}

bootJar {
    archiveFileName = 'notificaciones-service.jar'
}
